name: Popsicle read-only identity checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/popsicle-identity.yml'
      - 'tools/device/popsicle-identity-0189.sh'
      - 'tools/device/popsicle-identity-0190.sh'
      - 'tools/device/popsicle-transaction-0191.sh'
      - 'tools/device/popsicle-transaction-0192.sh'
      - 'tools/device/tests/test_transaction_0192.py'
      - 'tools/device/tests/test_boot_delta_0192.py'
      - 'tools/kernel/stock_cnss_boot_delta.py'
      - 'tools/device/tests/test_transaction_0191.py'
      - 'tools/kernel/stock_cnss_transaction.py'
      - 'kernel/abi/popsicle-stock-cnss-checker-base-0136.json'
      - 'tools/device/tests/test_identity_0189.py'
      - 'tools/kernel/stock_cnss_identity.py'
      - 'kernel/abi/popsicle-pair-deployment.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install mksh shell regression dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mksh
      - name: Syntax and host rejection tests (no native compilation)
        env:
          XAIRDROP_REQUIRE_MKSH: "1"
        run: |
          sh -n tools/device/popsicle-identity-0190.sh
          mksh -n tools/device/popsicle-identity-0190.sh
          sh -n tools/device/popsicle-transaction-0191.sh
          mksh -n tools/device/popsicle-transaction-0191.sh
          sh -n tools/device/popsicle-transaction-0192.sh
          mksh -n tools/device/popsicle-transaction-0192.sh
          python3 -m py_compile tools/kernel/stock_cnss_identity.py tools/kernel/stock_cnss_transaction.py tools/kernel/stock_cnss_boot_delta.py
          python3 -m unittest discover -s tools/device/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/kernel -p 'test_*.py'
      - name: Digest standalone read-only collector
        run: |
          cd tools/device
          sha256sum popsicle-identity-0190.sh popsicle-transaction-0192.sh > identity-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: popsicle-read-only-0192-no-driver
          path: |
            tools/device/popsicle-identity-0190.sh
            tools/device/popsicle-transaction-0192.sh
            tools/device/identity-SHA256SUMS
          if-no-files-found: error
