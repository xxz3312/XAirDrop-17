name: Popsicle diagnostic build

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Diagnostic stage (no installable module)
        type: choice
        options:
          - module-trial
          - wlan-object
          - prepare
        default: module-trial
  push:
    branches: [main]
    paths:
      - .github/workflows/popsicle-build.yml
      - tools/kernel/popsicle_*.py
      - tools/kernel/popsicle_*.sh
      - tools/kernel/passthru_mode_fixture.py
      - tools/kernel/mishare_mlme_fixture.py
      - tools/kernel/mishare_host_fixture.py
      - tools/kernel/mishare_backend_fixture.py
      - tools/kernel/test_*.py
      - tools/kernel/module_*.py
      - tools/kernel/btf_layout.py
      - kernel/configs/**
      - kernel/abi/**
      - kernel/compat/popsicle/**
      - kernel/patches/popsicle/**
      - kernel/provider/**
      - kernel/wonder/**
      - kernel/popsicle-availability/**
      - kernel/popsicle-hdd/**
      - docs/popsicle-source-lock.json

permissions:
  contents: read

concurrency:
  group: popsicle-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WORK: ${{ github.workspace }}/.popsicle-ci
      PHASE: ${{ inputs.phase || 'module-trial' }}
      POPSICLE_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Host regression checks
        run: |
          python3 -m unittest discover -s tools/kernel -p 'test_*.py'
          bash -n tools/kernel/popsicle_trial_build.sh
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison m4 bc pahole libelf-dev libdw-dev \
            libssl-dev pkg-config zlib1g-dev libzstd-dev curl git python3
      - name: Restore pinned toolchains
        id: toolchains
        uses: actions/cache/restore@v4
        with:
          path: |
            .popsicle-ci/toolchains/clang-r536225
            .popsicle-ci/toolchains/rust-1.82.0.p2
          key: popsicle-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/popsicle-source-lock.json') }}
      - name: Restore pinned bindgen
        id: bindgen
        uses: actions/cache/restore@v4
        with:
          path: |
            .popsicle-ci/toolchains/host/usr/bin/bindgen
            .popsicle-ci/toolchains/host/usr/bin/.popsicle-bindgen-source-url
          key: popsicle-bindgen-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/popsicle-source-lock.json') }}
      - name: Fetch locked sources and official toolchains
        id: setup
        run: python3 tools/kernel/popsicle_ci.py setup --work "$WORK"
      - name: Save complete toolchains before compilation
        if: steps.setup.outcome == 'success' && steps.toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .popsicle-ci/toolchains/clang-r536225
            .popsicle-ci/toolchains/rust-1.82.0.p2
          key: ${{ steps.toolchains.outputs.cache-primary-key }}
      - name: Save complete bindgen before compilation
        if: steps.setup.outcome == 'success' && steps.bindgen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .popsicle-ci/toolchains/host/usr/bin/bindgen
            .popsicle-ci/toolchains/host/usr/bin/.popsicle-bindgen-source-url
          key: ${{ steps.bindgen.outputs.cache-primary-key }}
      - name: Compile diagnostic objects
        run: python3 tools/kernel/popsicle_ci.py build --work "$WORK" --phase "$PHASE"
      - name: Check CNSS provider interfaces
        if: env.PHASE != 'prepare'
        run: python3 tools/kernel/popsicle_ci.py audit --work "$WORK"
      - name: Strict module linking and complete WLAN dependency gate
        if: env.PHASE == 'module-trial'
        run: python3 tools/kernel/popsicle_ci.py modules --link-only --work "$WORK"
      - name: Compare selected WLAN structure layouts with stock BTF metadata
        if: env.PHASE == 'module-trial'
        run: python3 tools/kernel/popsicle_ci.py layouts --work "$WORK"
      - name: Required recorded module checks (not runtime certification)
        if: env.PHASE == 'module-trial'
        run: python3 tools/kernel/popsicle_ci.py review --work "$WORK"
      - name: Upload diagnostics even when interface audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popsicle-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .popsicle-ci/artifacts/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Upload compact validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popsicle-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .popsicle-ci/artifacts/reports/
          if-no-files-found: warn
          retention-days: 7
