name: Popsicle diagnostic build

on:
  workflow_dispatch:
    inputs:
      icnss_reference:
        description: Build optional ICNSS reference (target popsicle uses PCIe/CNSS2)
        type: boolean
        default: false
      phase:
        description: Diagnostic stage (no installable module)
        type: choice
        options:
          - module-trial
          - wlan-object
          - prepare
        default: module-trial
  push:
    branches: [main]
    paths:
      - .github/workflows/popsicle-build.yml
      - tools/kernel/popsicle_*.py
      - tools/kernel/icnss_prefix_audit.py
      - tools/kernel/stock_cnss_audit.py
      - tools/kernel/popsicle_*.sh
      - tools/kernel/passthru_mode_fixture.py
      - tools/kernel/mishare_create_delete_fixture.py
      - tools/kernel/mishare_channel_fixture.py
      - tools/kernel/mishare_start_plan_fixture.py
      - tools/kernel/mishare_radio_fixture.py
      - tools/kernel/mishare_radio_origins.py
      - tools/kernel/mishare_shutdown_fixture.py
      - tools/kernel/mishare_shutdown_origins.py
      - tools/kernel/mishare_work_fixture.py
      - tools/kernel/mishare_work_origins.py
      - tools/kernel/mishare_recovery_fixture.py
      - tools/kernel/mishare_reset_context_fixture.py
      - tools/kernel/mishare_reset_context_origins.py
      - tools/kernel/mishare_recovery_origins.py
      - tools/kernel/mishare_parent_fixture.py
      - tools/kernel/mishare_parent_origins.py
