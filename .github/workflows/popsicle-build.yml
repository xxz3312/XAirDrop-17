      - tools/kernel/mishare_backend_fixture.py
      - tools/kernel/test_*.py
      - tools/kernel/module_*.py
      - tools/kernel/btf_layout.py
      - kernel/configs/**
      - kernel/abi/**
      - kernel/compat/popsicle/**
      - kernel/patches/popsicle/**
      - kernel/provider/**
      - kernel/wonder/**
      - kernel/popsicle-availability/**
      - kernel/popsicle-hdd/**
      - docs/popsicle-source-lock.json

permissions:
  contents: read

concurrency:
  group: popsicle-diagnostic-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  bridge-controller:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bridge and session ownership regression checks
        run: |
          python3 tools/kernel/mishare_session_driver_fixture.py
          python3 tools/kernel/mishare_bridge_fixture.py
          python3 tools/kernel/mishare_bridge_scope_fixture.py
          python3 tools/kernel/mishare_init_fixture.py
          python3 tools/kernel/mishare_rate_fixture.py
          python3 tools/kernel/mishare_rate_work_fixture.py
          python3 tools/kernel/wonder_managed_fixture.py
          python3 tools/kernel/wonder_provider_fixture.py
      - uses: actions/upload-artifact@v4
        with:
          name: popsicle-bridge-report-${{ github.run_id }}
          path: |
            .popsicle-ci/artifacts/reports/mishare-bridge*.json
            .popsicle-ci/artifacts/reports/mishare-init*.json
            .popsicle-ci/artifacts/reports/mishare-rate*.json
            .popsicle-ci/artifacts/reports/wonder-*.json
          if-no-files-found: error
          retention-days: 7
  stop-admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned WLAN and apply existing patches
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/stop-admission-wlan"
          git -C "$RUNNER_TEMP/stop-admission-wlan" remote add origin https://github.com/MiCode/vendor_qcom_opensource_wlan.git
          git -C "$RUNNER_TEMP/stop-admission-wlan" fetch --depth=1 origin 36df473046706a5259942e1bf7222108dbbb860f
          git -C "$RUNNER_TEMP/stop-admission-wlan" checkout --detach FETCH_HEAD
          for patch in "$GITHUB_WORKSPACE"/kernel/patches/popsicle/*.patch; do
            git -C "$RUNNER_TEMP/stop-admission-wlan" apply "$patch"
          done
      - name: External live-unload and native lifecycle with sanitizers
        run: python3 tools/kernel/mishare_live_fixture.py --wlan "$RUNNER_TEMP/stop-admission-wlan" --output stop-live.json
      - name: Complete HDD unload result with sanitizers
        run: python3 tools/kernel/mishare_unload_result_fixture.py --wlan "$RUNNER_TEMP/stop-admission-wlan" --output stop-unload-result.json
      - name: Native registration rollback and HDD load retention
        run: python3 tools/kernel/mishare_registration_fixture.py --wlan "$RUNNER_TEMP/stop-admission-wlan" --output stop-registration.json
      - name: Native PCIe and CNSS2 checked lifecycle with sanitizers
        run: python3 tools/kernel/mishare_cnss_fixture.py --wlan "$RUNNER_TEMP/stop-admission-wlan" --output stop-cnss.json
      - name: Restored native CNSS2 interfaces with sanitizers
        run: python3 tools/kernel/mishare_cnss_interfaces_fixture.py --wlan "$RUNNER_TEMP/stop-admission-wlan" --output stop-cnss-interfaces.json
      - name: Production host and runtime stop admission with sanitizers
        run: |
          python3 tools/kernel/mishare_host_fixture.py --wlan "$RUNNER_TEMP/stop-admission-wlan" --output stop-host.json
          python3 tools/kernel/mishare_runtime_fixture.py --wlan "$RUNNER_TEMP/stop-admission-wlan" --output stop-runtime.json
          python3 tools/kernel/mishare_execution_fixture.py --wlan "$RUNNER_TEMP/stop-admission-wlan" --output stop-execution.json
          python3 tools/kernel/mishare_pcie_execution_fixture.py --wlan "$RUNNER_TEMP/stop-admission-wlan" --output stop-pcie-execution.json
          python3 tools/kernel/mishare_icnss_fixture.py --wlan "$RUNNER_TEMP/stop-admission-wlan" --output stop-icnss.json
      - uses: actions/upload-artifact@v4
        with:
          name: popsicle-stop-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stop-host.json
            stop-runtime.json
            stop-execution.json
            stop-pcie-execution.json
            stop-live.json
            stop-unload-result.json
            stop-registration.json
            stop-cnss.json
            stop-cnss-interfaces.json
            stop-icnss.json
          if-no-files-found: error
          retention-days: 7

  ce-buffers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned WLAN and apply existing patches
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/ce-buffers-wlan"
          git -C "$RUNNER_TEMP/ce-buffers-wlan" remote add origin https://github.com/MiCode/vendor_qcom_opensource_wlan.git
          git -C "$RUNNER_TEMP/ce-buffers-wlan" fetch --depth=1 origin 36df473046706a5259942e1bf7222108dbbb860f
          git -C "$RUNNER_TEMP/ce-buffers-wlan" checkout --detach FETCH_HEAD
          for patch in "$GITHUB_WORKSPACE"/kernel/patches/popsicle/*.patch; do
            git -C "$RUNNER_TEMP/ce-buffers-wlan" apply "$patch"
          done
      - name: Native residual CE RX and TX cleanup with sanitizers
        run: python3 tools/kernel/mishare_native_ce_buffers_fixture.py --wlan "$RUNNER_TEMP/ce-buffers-wlan" --output native-ce-buffers.json
      - uses: actions/upload-artifact@v4
        with:
          name: popsicle-ce-buffers-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-ce-buffers.json
          if-no-files-found: error
          retention-days: 7

  ce-stop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned WLAN and apply existing patches
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/ce-stop-wlan"
          git -C "$RUNNER_TEMP/ce-stop-wlan" remote add origin https://github.com/MiCode/vendor_qcom_opensource_wlan.git
          git -C "$RUNNER_TEMP/ce-stop-wlan" fetch --depth=1 origin 36df473046706a5259942e1bf7222108dbbb860f
          git -C "$RUNNER_TEMP/ce-stop-wlan" checkout --detach FETCH_HEAD
          for patch in "$GITHUB_WORKSPACE"/kernel/patches/popsicle/*.patch; do
            git -C "$RUNNER_TEMP/ce-stop-wlan" apply "$patch"
          done
      - name: Native CE stop and IPCI producer drain with sanitizers
        run: python3 tools/kernel/mishare_native_ce_stop_fixture.py --wlan "$RUNNER_TEMP/ce-stop-wlan" --output native-ce-stop.json
      - uses: actions/upload-artifact@v4
        with:
          name: popsicle-ce-stop-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-ce-stop.json
          if-no-files-found: error
          retention-days: 7

  transport-stop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned WLAN and apply existing patches
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/transport-stop-wlan"
          git -C "$RUNNER_TEMP/transport-stop-wlan" remote add origin https://github.com/MiCode/vendor_qcom_opensource_wlan.git
          git -C "$RUNNER_TEMP/transport-stop-wlan" fetch --depth=1 origin 36df473046706a5259942e1bf7222108dbbb860f
          git -C "$RUNNER_TEMP/transport-stop-wlan" checkout --detach FETCH_HEAD
          for patch in "$GITHUB_WORKSPACE"/kernel/patches/popsicle/*.patch; do
            git -C "$RUNNER_TEMP/transport-stop-wlan" apply "$patch"
          done
      - name: Native HIF receive and HTC stop ordering with sanitizers
        run: python3 tools/kernel/mishare_native_transport_stop_fixture.py --wlan "$RUNNER_TEMP/transport-stop-wlan" --output native-transport-stop.json
      - uses: actions/upload-artifact@v4
        with:
          name: popsicle-transport-stop-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-transport-stop.json
          if-no-files-found: error
          retention-days: 7

  htt-callbacks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned WLAN and apply existing patches
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/htt-callback-wlan"
          git -C "$RUNNER_TEMP/htt-callback-wlan" remote add origin https://github.com/MiCode/vendor_qcom_opensource_wlan.git
          git -C "$RUNNER_TEMP/htt-callback-wlan" fetch --depth=1 origin 36df473046706a5259942e1bf7222108dbbb860f
          git -C "$RUNNER_TEMP/htt-callback-wlan" checkout --detach FETCH_HEAD
          for patch in "$GITHUB_WORKSPACE"/kernel/patches/popsicle/*.patch; do
            git -C "$RUNNER_TEMP/htt-callback-wlan" apply "$patch"
          done
      - name: Native HTC registration and HIF callback composite with sanitizers
        run: python3 tools/kernel/mishare_native_htt_callbacks_fixture.py --wlan "$RUNNER_TEMP/htt-callback-wlan" --output native-htt-callbacks.json
      - uses: actions/upload-artifact@v4
        with:
          name: popsicle-htt-callbacks-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-htt-callbacks.json
          if-no-files-found: error
          retention-days: 7

  parent-peer-composite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned WLAN and apply existing patches
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/parent-peer-wlan"
          git -C "$RUNNER_TEMP/parent-peer-wlan" remote add origin https://github.com/MiCode/vendor_qcom_opensource_wlan.git
          git -C "$RUNNER_TEMP/parent-peer-wlan" fetch --depth=1 origin 36df473046706a5259942e1bf7222108dbbb860f
          git -C "$RUNNER_TEMP/parent-peer-wlan" checkout --detach FETCH_HEAD
          for patch in "$GITHUB_WORKSPACE"/kernel/patches/popsicle/*.patch; do
            git -C "$RUNNER_TEMP/parent-peer-wlan" apply "$patch"
          done
      - name: Production HTT peer unmap parser and nbuf ownership with sanitizers
        run: python3 tools/kernel/mishare_native_htt_unmap_fixture.py --wlan "$RUNNER_TEMP/parent-peer-wlan" --output native-htt-unmap.json
      - name: Native DP peer unmap lookup and map removal with sanitizers
        run: python3 tools/kernel/mishare_native_dp_unmap_fixture.py --wlan "$RUNNER_TEMP/parent-peer-wlan" --output native-dp-unmap.json
      - name: Native parent and peer composite with sanitizers
        run: python3 tools/kernel/mishare_parent_peer_composite_fixture.py --wlan "$RUNNER_TEMP/parent-peer-wlan" --output parent-peer-composite.json
      - name: Native heap PDEV dispatcher and final free with sanitizers
        run: python3 tools/kernel/mishare_native_pdev_free_fixture.py --wlan "$RUNNER_TEMP/parent-peer-wlan" --output native-pdev-free.json
      - name: Native PSOC reference lease through PDEV free with sanitizers
        run: python3 tools/kernel/mishare_native_psoc_lease_fixture.py --wlan "$RUNNER_TEMP/parent-peer-wlan" --output native-psoc-lease.json
      - name: Native heap PSOC dispatcher and final free with sanitizers
        run: python3 tools/kernel/mishare_native_psoc_free_fixture.py --wlan "$RUNNER_TEMP/parent-peer-wlan" --output native-psoc-free.json
      - name: Native DP VDEV final free and production completion with sanitizers
        run: python3 tools/kernel/mishare_native_dp_vdev_free_fixture.py --wlan "$RUNNER_TEMP/parent-peer-wlan" --output native-dp-vdev-free.json
      - name: Native DP peer free returning VDEV CHILD reference with sanitizers
        run: python3 tools/kernel/mishare_native_dp_peer_free_fixture.py --wlan "$RUNNER_TEMP/parent-peer-wlan" --output native-dp-peer-free.json
      - uses: actions/upload-artifact@v4
        with:
          name: popsicle-parent-peer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            parent-peer-composite.json
            native-pdev-free.json
            native-psoc-lease.json
            native-psoc-free.json
            native-dp-vdev-free.json
            native-dp-peer-free.json
            native-dp-unmap.json
            native-htt-unmap.json
          if-no-files-found: error
          retention-days: 7

  checked-platform:
    name: Optional ICNSS reference (not target CNSS2)
    if: github.event_name == 'workflow_dispatch' && inputs.icnss_reference
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WORK: ${{ github.workspace }}/.popsicle-ci
      POPSICLE_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host build dependencies
        run: |
          # Only Ubuntu packages are needed. Unrelated runner repositories can
          # fail independently (e.g. Microsoft 403) and block apt-get update.
          apt_sources="$RUNNER_TEMP/popsicle-ubuntu-sources"
          mkdir -p "$apt_sources"
          cp /etc/apt/sources.list.d/ubuntu.sources "$apt_sources/ubuntu.sources"
          apt_options=(-o Dir::Etc::sourcelist=/dev/null
                       -o "Dir::Etc::sourceparts=$apt_sources"
                       -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            build-essential flex bison m4 bc pahole libelf-dev libdw-dev \
            libssl-dev pkg-config zlib1g-dev libzstd-dev curl git python3
      - name: Restore pinned toolchains
        id: toolchains
        uses: actions/cache/restore@v4
        with:
          path: |
            .popsicle-ci/toolchains/clang-r536225
            .popsicle-ci/toolchains/rust-1.82.0.p2
          key: popsicle-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/popsicle-source-lock.json') }}
      - name: Restore pinned bindgen
        id: bindgen
        uses: actions/cache/restore@v4
        with:
          path: |
            .popsicle-ci/toolchains/host/usr/bin/bindgen
            .popsicle-ci/toolchains/host/usr/bin/.popsicle-bindgen-source-url
          key: popsicle-bindgen-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/popsicle-source-lock.json') }}
      - name: Fetch locked sources and official toolchains
        id: setup
        run: python3 tools/kernel/popsicle_ci.py setup --work "$WORK"
      - name: Save complete toolchains before compilation
        if: steps.setup.outcome == 'success' && steps.toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .popsicle-ci/toolchains/clang-r536225
            .popsicle-ci/toolchains/rust-1.82.0.p2
          key: ${{ steps.toolchains.outputs.cache-primary-key }}
      - name: Save complete bindgen before compilation
        if: steps.setup.outcome == 'success' && steps.bindgen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .popsicle-ci/toolchains/host/usr/bin/bindgen
            .popsicle-ci/toolchains/host/usr/bin/.popsicle-bindgen-source-url
          key: ${{ steps.bindgen.outputs.cache-primary-key }}
      - name: Strict ICNSS reference and target transport audit
        run: python3 tools/kernel/popsicle_checked_platform.py --reference-only --work "$WORK"
      - name: Upload checked pair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popsicle-checked-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: .popsicle-ci/artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload compact checked pair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popsicle-checked-pair-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .popsicle-ci/artifacts/reports/
          if-no-files-found: warn
          retention-days: 7

  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WORK: ${{ github.workspace }}/.popsicle-ci
      PHASE: ${{ inputs.phase || 'module-trial' }}
      POPSICLE_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Host regression checks
        run: |
          python3 -m unittest discover -s tools/kernel -p 'test_*.py'
          bash -n tools/kernel/popsicle_trial_build.sh
          python3 tools/kernel/mishare_mgmt_rx_fixture.py
          python3 tools/kernel/mishare_session_driver_fixture.py
          python3 tools/kernel/wonder_managed_fixture.py
          python3 tools/kernel/wonder_provider_fixture.py
      - name: Install host build dependencies
        run: |
          # Only Ubuntu packages are needed. Unrelated runner repositories can
          # fail independently (e.g. Microsoft 403) and block apt-get update.
          apt_sources="$RUNNER_TEMP/popsicle-ubuntu-sources"
          mkdir -p "$apt_sources"
          cp /etc/apt/sources.list.d/ubuntu.sources "$apt_sources/ubuntu.sources"
          apt_options=(-o Dir::Etc::sourcelist=/dev/null
                       -o "Dir::Etc::sourceparts=$apt_sources"
                       -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            build-essential flex bison m4 bc pahole libelf-dev libdw-dev \
            libssl-dev pkg-config zlib1g-dev libzstd-dev curl git python3
      - name: Restore pinned toolchains
        id: toolchains
        uses: actions/cache/restore@v4
        with:
          path: |
            .popsicle-ci/toolchains/clang-r536225
            .popsicle-ci/toolchains/rust-1.82.0.p2
          key: popsicle-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/popsicle-source-lock.json') }}
      - name: Restore pinned bindgen
        id: bindgen
        uses: actions/cache/restore@v4
        with:
          path: |
            .popsicle-ci/toolchains/host/usr/bin/bindgen
            .popsicle-ci/toolchains/host/usr/bin/.popsicle-bindgen-source-url
          key: popsicle-bindgen-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/popsicle-source-lock.json') }}
      - name: Fetch locked sources and official toolchains
        id: setup
        run: python3 tools/kernel/popsicle_ci.py setup --work "$WORK"
      - name: Save complete toolchains before compilation
        if: steps.setup.outcome == 'success' && steps.toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .popsicle-ci/toolchains/clang-r536225
            .popsicle-ci/toolchains/rust-1.82.0.p2
          key: ${{ steps.toolchains.outputs.cache-primary-key }}
      - name: Save complete bindgen before compilation
        if: steps.setup.outcome == 'success' && steps.bindgen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .popsicle-ci/toolchains/host/usr/bin/bindgen
            .popsicle-ci/toolchains/host/usr/bin/.popsicle-bindgen-source-url
          key: ${{ steps.bindgen.outputs.cache-primary-key }}
      - name: Compile diagnostic objects
        run: python3 tools/kernel/popsicle_ci.py build --work "$WORK" --phase "$PHASE"
      - name: Check CNSS provider interfaces
        if: env.PHASE != 'prepare'
        run: python3 tools/kernel/popsicle_ci.py audit --work "$WORK"
      - name: Strict module linking and complete WLAN dependency gate
        if: env.PHASE == 'module-trial'
        run: python3 tools/kernel/popsicle_ci.py modules --link-only --work "$WORK"
      - name: Compare selected WLAN structure layouts with stock BTF metadata
        if: env.PHASE == 'module-trial'
        run: python3 tools/kernel/popsicle_ci.py layouts --work "$WORK"
      - name: Required recorded module checks (not runtime certification)
        if: env.PHASE == 'module-trial'
        run: python3 tools/kernel/popsicle_ci.py review --work "$WORK"
      - name: Upload diagnostics even when interface audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popsicle-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .popsicle-ci/artifacts/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Upload compact validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popsicle-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .popsicle-ci/artifacts/reports/
          if-no-files-found: warn
          retention-days: 7
