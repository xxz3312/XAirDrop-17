name: Popsicle 0204 candidate HAL scan evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/popsicle-evidence0204.yml'
      - 'tools/device/popsicle-hal-scan-evidence-0204.sh'
      - 'tools/evidence0204/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install mksh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mksh
      - name: Qualify unchanged source evidence and exclusive publication
        env:
          XAIRDROP_REQUIRE_MKSH: '1'
        run: |
          sh -n tools/device/popsicle-hal-scan-evidence-0204.sh
          mksh -n tools/device/popsicle-hal-scan-evidence-0204.sh
          python3 -m unittest discover -s tools/evidence0204 -p 'test_*.py'
