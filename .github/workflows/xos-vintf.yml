name: Xiaomi XOS VINTF module
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/xos-vintf.yml
      - modules/xos-vintf/**
      - tools/xos/package_vintf.py
      - tools/device/popsicle-xos-service-smoke.sh
      - tests/test_xos_vintf.py
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check module boundaries and shell syntax
        run: |
          python3 -m unittest discover -s tests -p 'test_xos_vintf.py'
          sh -n modules/xos-vintf/customize.sh
          sh -n modules/xos-vintf/action.sh
          sh -n tools/device/popsicle-xos-service-smoke.sh
      - name: Package declaration and measured lookup rule
        run: python3 tools/xos/package_vintf.py --output "$RUNNER_TEMP/xos-vintf"
      - name: Stage module contents at the downloadable artifact root
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,zipfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'xos-vintf'
          stage=out/'installable';stage.mkdir()
          report=json.loads((out/'build.json').read_text())
          with zipfile.ZipFile(out/'XAirDrop-17-XOS-VINTF-0.2.zip') as z:
              if sorted(z.namelist())!=report['entries']:
                  raise SystemExit('Module archive entry mismatch')
              for name in z.namelist():
                  if pathlib.PurePosixPath(name).is_absolute() or '..' in pathlib.PurePosixPath(name).parts:
                      raise SystemExit('Invalid module path')
              z.extractall(stage)
          if not (stage/'module.prop').is_file() or any(stage.rglob('*.zip')):
              raise SystemExit('Artifact must itself contain the installable module, without a nested ZIP')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: XAirDrop-17-XOS-VINTF-0.2
          path: ${{ runner.temp }}/xos-vintf/installable/
          if-no-files-found: error
          retention-days: 7
